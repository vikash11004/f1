<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="F1 Prediction League — Predict the finishing order of every Grand Prix session, earn points, and compete on the season leaderboard.">
  <meta name="theme-color" content="#141516">
  <title>F1 PREDICT — Formula 1 Prediction League</title>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" href="assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/paddock.css">

  <!-- Excel Export (SheetJS) -->
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div class="app" id="app">

    <!-- ===== HEADER / NAV ===== -->
    <header class="app-header hidden" id="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <button class="btn btn-icon btn-ghost mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="header-nav" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <a href="#dashboard" class="header-logo">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>F1<span class="brand-light">PREDICT</span><span class="brand-dot">®</span></span>
          </a>
        </div>

        <nav class="header-nav" id="header-nav" role="navigation" aria-label="Main navigation">
          <button class="nav-item" data-page="dashboard" aria-label="Dashboard">
            <span class="nav-number">01</span> Overview
          </button>
          <button class="nav-item" data-page="races" aria-label="Races">
            <span class="nav-number">02</span> Race calendar
          </button>
          <button class="nav-item" data-page="leaderboard" aria-label="Leaderboard">
            <span class="nav-number">03</span> Standings
          </button>
        </nav>

        <div class="header-actions" id="header-actions"></div>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="app-main" id="main-content" tabindex="-1">

      <!-- Auth Page -->
      <section class="page active" id="auth-page"></section>

      <!-- Dashboard Page -->
      <section class="page" id="dashboard-page"></section>

      <!-- Races Page -->
      <section class="page" id="races-page"></section>

      <!-- Prediction Builder Page -->
      <section class="page" id="predict-page"></section>

      <!-- Results Entry Page (Admin) -->
      <section class="page" id="results-page"></section>

      <!-- Leaderboard Page -->
      <section class="page" id="leaderboard-page"></section>

    </main>

    <footer class="app-footer"><span>F1 PREDICT / THE 2026 SEASON</span><span>EVERY POSITION. EVERY POINT. <svg class="icon diagonal-arrow text-accent" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></footer>

    <!-- ===== OVERLAYS ===== -->

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- Modal Container -->
    <div class="hidden" id="modal-container"></div>

    <!-- Side Panel -->
    <div class="side-panel-overlay" id="side-panel-overlay"></div>
    <div class="side-panel" id="side-panel"></div>

    <!-- Global Chat -->
    <div class="global-chat-wrapper hidden" id="global-chat-wrapper">
      <div class="chat-popup hidden" id="chat-popup">
        <div class="chat-header">
          <div class="chat-title">Paddock chat</div>
          <button class="btn btn-icon btn-ghost" id="btn-close-chat" aria-label="Close Chat">✕</button>
        </div>
        <div class="chat-messages" id="chat-messages">
          <!-- Messages go here -->
        </div>
        <form class="chat-input-form" id="chat-input-form">
          <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required maxlength="200" />
          <button type="submit" class="chat-send-btn" aria-label="Send"><i class="fas fa-paper-plane">↑</i></button>
        </form>
      </div>
      <button class="chat-fab" id="chat-fab" aria-label="Open Chat">
        <div class="chat-fab-avatar" id="chat-fab-avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 11a9 9 0 0 1-9 9H4l-2 2V11a9 9 0 0 1 19 0Z"/><path d="M7 10h10m-10 4h6"/></svg></div>
      </button>
    </div>

  </div>

  <!-- ===== APPLICATION BOOTSTRAP ===== -->
  <script type="module">
    import { renderAuthShell, showConnectionError } from './js/auth-view.js';
    document.querySelector('.skip-link').addEventListener('click', event => {
      event.preventDefault();
      const main = document.getElementById('main-content');
      main.focus();
      main.scrollIntoView({ behavior: 'instant' });
    });
    renderAuthShell();
    const connectionTimer = setTimeout(showConnectionError, 15000);
    import('./js/app.js').then(() => clearTimeout(connectionTimer)).catch(error => {
      clearTimeout(connectionTimer);
      console.error('Unable to start the application:', error);
      showConnectionError();
    });
  </script>
  <noscript><p class="noscript-message">Enable JavaScript to join the F1 Predict league.</p></noscript>
</body>
</html>
